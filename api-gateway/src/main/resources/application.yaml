server:
  port: 8080

spring:
  application:
    name: ead-api-gateway
  cloud:
    gateway:
      routes:
        - id: authuser-service
          uri: lb://EAD-AUTHUSER-SERVICE
          predicates:
            - Path=/ead-authuser/**
        - id: course-service
          uri: lb://EAD-COURSE-SERVICE
          predicates:
            - Path=/ead-course/**
        - id: notification-service
          uri:
            lb://EAD-NOTIFICATION-SERVICE
          predicates:
            - Path=/ead-notification/**
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: TRACE
ead:
  serviceRegistry:
    username: ${USER_NAME_REGISTRY}
    password: ${PASSWORD_REGISTRY}

eureka:
  client:
    serviceUrl:
      defaultZone: 'http://${ead.serviceRegistry.username}:${ead.serviceRegistry.password}@localhost:8761/eureka/'
  instance:
    hostname: localhost